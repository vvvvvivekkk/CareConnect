<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CareConnect</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>🏥 CareConnect</h1>
            <p>Create Your Account</p>
            
            <!-- Role Tabs -->
            <div class="role-tabs">
                <button class="tab-btn active" onclick="switchRole('patient')">👤 Patient</button>
                <button class="tab-btn" onclick="switchRole('doctor')">👨‍⚕️ Doctor</button>
            </div>
            
            <!-- Patient Registration Form -->
            <form id="patient-register-form" class="register-form active">
                <div class="form-group">
                    <label for="patient-name">Full Name</label>
                    <input type="text" id="patient-name" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="patient-email">Email</label>
                    <input type="email" id="patient-email" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="patient-age">Age (optional)</label>
                    <input type="number" id="patient-age" class="form-control" min="1" max="120">
                </div>
                
                <div class="form-group">
                    <label for="patient-password">Password</label>
                    <input type="password" id="patient-password" class="form-control" required minlength="6">
                    <small class="text-muted">Minimum 6 characters</small>
                </div>
                
                <div class="form-group">
                    <label for="patient-confirm-password">Confirm Password</label>
                    <input type="password" id="patient-confirm-password" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Register as Patient</button>
            </form>

            <!-- Doctor Registration Form -->
            <form id="doctor-register-form" class="register-form">
                <div class="form-group">
                    <label for="doctor-name">Full Name</label>
                    <input type="text" id="doctor-name" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="doctor-email">Email</label>
                    <input type="email" id="doctor-email" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="doctor-specialization">Specialization</label>
                    <select id="doctor-specialization" class="form-control" required>
                        <option value="">Select Specialization</option>
                        <option value="cardiologist">Cardiologist</option>
                        <option value="dermatologist">Dermatologist</option>
                        <option value="general practitioner">General Practitioner</option>
                        <option value="neurologist">Neurologist</option>
                        <option value="orthopedic">Orthopedic</option>
                        <option value="pediatrician">Pediatrician</option>
                        <option value="dentist">Dentist</option>
                        <option value="psychiatrist">Psychiatrist</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="doctor-experience">Years of Experience</label>
                    <input type="number" id="doctor-experience" class="form-control" min="0" max="70" required>
                </div>
                
                <div class="form-group">
                    <label for="doctor-password">Password</label>
                    <input type="password" id="doctor-password" class="form-control" required minlength="6">
                    <small class="text-muted">Minimum 6 characters</small>
                </div>
                
                <div class="form-group">
                    <label for="doctor-confirm-password">Confirm Password</label>
                    <input type="password" id="doctor-confirm-password" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Register as Doctor</button>
            </form>
            
            <p class="text-center mt-3">
                Already have an account? <a href="/login">Login here</a>
            </p>
        </div>
    </div>
    
    <script src="/static/js/utils.js"></script>
    <script>
        // Redirect if already logged in
        if (isAuthenticated()) {
            window.location.href = '/dashboard';
        }
        
        const patientForm = document.getElementById('patient-register-form');
        const doctorForm = document.getElementById('doctor-register-form');
        
        // Switch between patient and doctor registration
        function switchRole(role) {
            const forms = document.querySelectorAll('.register-form');
            const tabs = document.querySelectorAll('.tab-btn');
            
            forms.forEach(form => form.classList.remove('active'));
            tabs.forEach(tab => tab.classList.remove('active'));
            
            if (role === 'patient') {
                document.getElementById('patient-register-form').classList.add('active');
                document.querySelector('[onclick="switchRole(\'patient\')"]').classList.add('active');
            } else {
                document.getElementById('doctor-register-form').classList.add('active');
                document.querySelector('[onclick="switchRole(\'doctor\')"]').classList.add('active');
            }
        }
        
        // Patient Registration
        patientForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('patient-name').value;
            const email = document.getElementById('patient-email').value;
            const age = document.getElementById('patient-age').value;
            const password = document.getElementById('patient-password').value;
            const confirmPassword = document.getElementById('patient-confirm-password').value;
            
            // Validate passwords match
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }
            
            try {
                const submitBtn = patientForm.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Creating Account...';
                
                const userData = { name, email, password, role: 'patient' };
                if (age) {
                    userData.age = parseInt(age);
                }
                
                const data = await apiCall('/users/register', {
                    method: 'POST',
                    body: JSON.stringify(userData)
                });
                
                // Save auth data
                saveAuth(data.access_token, data.user);
                
                // Redirect to dashboard
                window.location.href = '/dashboard';
                
            } catch (error) {
                alert('Registration failed: ' + error.message);
                const submitBtn = patientForm.querySelector('button[type="submit"]');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register as Patient';
            }
        });

        // Doctor Registration
        doctorForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('doctor-name').value;
            const email = document.getElementById('doctor-email').value;
            const specialization = document.getElementById('doctor-specialization').value;
            const experience = document.getElementById('doctor-experience').value;
            const password = document.getElementById('doctor-password').value;
            const confirmPassword = document.getElementById('doctor-confirm-password').value;
            
            // Validate passwords match
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }
            
            try {
                const submitBtn = doctorForm.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Creating Account...';
                
                const doctorData = {
                    name,
                    email,
                    password,
                    specialization,
                    experience: parseInt(experience)
                };
                
                const data = await apiCall('/users/doctor/register', {
                    method: 'POST',
                    body: JSON.stringify(doctorData)
                });
                
                // Save auth data
                saveAuth(data.access_token, data.user);
                
                // Redirect to doctor dashboard
                window.location.href = '/doctor-dashboard';
                
            } catch (error) {
                alert('Registration failed: ' + error.message);
                const submitBtn = doctorForm.querySelector('button[type="submit"]');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register as Doctor';
            }
        });

        // Make switchRole available globally
        window.switchRole = switchRole;
    </script>

    <style>
        .role-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
        }

        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: bold;
            color: #666;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            color: #4f46e5;
        }

        .tab-btn.active {
            color: #4f46e5;
            border-bottom-color: #4f46e5;
        }

        .register-form {
            display: none;
        }

        .register-form.active {
            display: block;
        }
    </style>
</body>
</html>
