<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - CareConnect</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <h1>🏥 CareConnect</h1>
            <div class="nav-links">
                <a href="/dashboard">Dashboard</a>
                <a href="/doctors">Find Doctors</a>
                <a href="/appointments">Appointments</a>
                <a href="/period">Period Tracker</a>
                <a href="/reports">Reports</a>
                <a href="/chatbot">Chatbot</a>
                <div id="user-info"></div>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2>📅 Appointments</h2>

        <!-- Quick Action -->
        <div class="card">
            <h3>📋 Want to book a new appointment?</h3>
            <p class="text-muted">Browse our doctors and book an appointment</p>
            <a href="/doctors" class="btn btn-primary">Find Doctors</a>
        </div>

        <!-- Appointments List -->
        <div class="card">
            <h2>Your Appointments</h2>
            <div id="appointments-list">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/utils.js"></script>
    <script>
        requireAuth();
        initNavigation();

        // Cancel appointment
        async function loadAppointments() {
            try {
                const appointments = await apiCall('/appointments');
                const appointmentsList = document.getElementById('appointments-list');

                if (appointments.length === 0) {
                    appointmentsList.innerHTML = '<p class="text-muted">No appointments yet. <a href="/doctors">Browse doctors</a> to book one.</p>';
                    return;
                }

                // Sort by date (newest first)
                appointments.sort((a, b) => {
                    const dateA = new Date(a.date + ' ' + a.time);
                    const dateB = new Date(b.date + ' ' + b.time);
                    return dateB - dateA;
                });

                // Get doctor info for each appointment
                let appointmentsHtml = '<ul class="appointment-list">';

                for (const apt of appointments) {
                    let doctorName = 'Doctor #' + apt.doctor_id;
                    try {
                        const docResponse = await apiCall(`/doctors/${apt.doctor_id}`);
                        doctorName = `Dr. ${docResponse.name} - ${docResponse.specialization}`;
                    } catch (e) {
                        console.error('Error getting doctor info:', e);
                    }

                    let statusBadge;
                    if (apt.status === 'scheduled') {
                        statusBadge = '<span style="color: var(--success-color);">✓ Scheduled</span>';
                    } else if (apt.status === 'completed') {
                        statusBadge = '<span style="color: blue;">★ Completed</span>';
                    } else {
                        statusBadge = '<span style="color: var(--danger-color);">✗ Cancelled</span>';
                    }

                    appointmentsHtml += `
                        <li class="appointment-item">
                            <div class="appointment-info">
                                <h4>${doctorName}</h4>
                                <p>${formatDate(apt.date)} at ${formatTime(apt.time)}</p>
                                <p>${statusBadge}</p>
                                ${apt.meeting_link ? `<p class="mt-2"><strong>Meeting:</strong> ${apt.meeting_link}</p>` : ''}
                            </div>
                            <div class="appointment-actions">
                                ${apt.status === 'scheduled' && apt.meeting_link ? `
                                    <a class="btn btn-success" 
                                       href="${apt.meeting_link}"
                                       target="_blank"
                                       rel="noopener noreferrer">
                                        🎥 Join Video Call
                                    </a>
                                ` : ''}
                                ${apt.status === 'scheduled' ? `
                                    <button class="btn btn-danger" 
                                            onclick="cancelAppointment(${apt.id})">
                                        Cancel
                                    </button>
                                ` : ''}
                            </div>
                        </li>
                    `;
                }
                appointmentsHtml += '</ul>';
                appointmentsList.innerHTML = appointmentsHtml;

            } catch (error) {
                document.getElementById('appointments-list').innerHTML =
                    '<p class="text-muted">Error loading appointments</p>';
                console.error('Error loading appointments:', error);
            }
        }

        // Cancel appointment
        async function cancelAppointment(appointmentId) {
            if (!confirm('Are you sure you want to cancel this appointment?')) {
                return;
            }

            try {
                await apiCall(`/appointments/${appointmentId}`, {
                    method: 'DELETE'
                });

                showAlert('Appointment cancelled successfully', 'success');
                loadAppointments();

            } catch (error) {
                showAlert('Failed to cancel appointment: ' + error.message, 'danger');
            }
        }

        // Make cancelAppointment available globally
        window.cancelAppointment = cancelAppointment;

        // Load appointments on page load
        loadAppointments();
    </script>
</body>

</html>
