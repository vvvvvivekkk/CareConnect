<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - CareConnect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1>🏥 CareConnect</h1>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="appointment.html">Appointments</a>
                <a href="period.html">Period Tracker</a>
                <a href="upload.html">Reports</a>
                <a href="chatbot.html">Chatbot</a>
                <div id="user-info"></div>
            </div>
        </div>
    </nav>
    
    <div class="container">
        <h2>📅 Appointments</h2>
        
        <!-- Book New Appointment -->
        <div class="card">
            <h2>Book New Appointment</h2>
            <form id="appointment-form">
                <div class="form-group">
                    <label for="doctor-name">Doctor Name</label>
                    <input type="text" id="doctor-name" class="form-control" 
                           placeholder="e.g., Dr. Smith" required>
                </div>
                
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="time">Time</label>
                    <input type="time" id="time" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Book Appointment</button>
            </form>
        </div>
        
        <!-- Appointments List -->
        <div class="card">
            <h2>Your Appointments</h2>
            <div id="appointments-list">
                <div class="spinner"></div>
            </div>
        </div>
    </div>
    
    <script src="js/utils.js"></script>
    <script>
        requireAuth();
        initNavigation();
        
        // Set minimum date to today
        const dateInput = document.getElementById('date');
        const today = new Date().toISOString().split('T')[0];
        dateInput.min = today;
        dateInput.value = today;
        
        // Book appointment form
        const appointmentForm = document.getElementById('appointment-form');
        
        appointmentForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const doctorName = document.getElementById('doctor-name').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            
            try {
                const submitBtn = appointmentForm.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Booking...';
                
                await apiCall('/appointments', {
                    method: 'POST',
                    body: JSON.stringify({
                        doctor_name: doctorName,
                        date: date,
                        time: time
                    })
                });
                
                showAlert('Appointment booked successfully!', 'success');
                appointmentForm.reset();
                dateInput.value = today;
                
                // Reload appointments
                loadAppointments();
                
                submitBtn.disabled = false;
                submitBtn.textContent = 'Book Appointment';
                
            } catch (error) {
                showAlert('Failed to book appointment: ' + error.message, 'danger');
                const submitBtn = appointmentForm.querySelector('button[type="submit"]');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Book Appointment';
            }
        });
        
        // Load appointments
        async function loadAppointments() {
            try {
                const appointments = await apiCall('/appointments');
                const appointmentsList = document.getElementById('appointments-list');
                
                if (appointments.length === 0) {
                    appointmentsList.innerHTML = '<p class="text-muted">No appointments yet</p>';
                    return;
                }
                
                // Sort by date (newest first)
                appointments.sort((a, b) => {
                    const dateA = new Date(a.date + ' ' + a.time);
                    const dateB = new Date(b.date + ' ' + b.time);
                    return dateB - dateA;
                });
                
                appointmentsList.innerHTML = '<ul class="appointment-list">' +
                    appointments.map(apt => {
                        const statusBadge = apt.status === 'scheduled' 
                            ? '<span style="color: var(--success-color);">✓ Scheduled</span>'
                            : '<span style="color: var(--danger-color);">✗ Cancelled</span>';
                        
                        return `
                            <li class="appointment-item">
                                <div class="appointment-info">
                                    <h4>Dr. ${apt.doctor_name}</h4>
                                    <p>${formatDate(apt.date)} at ${formatTime(apt.time)}</p>
                                    <p>${statusBadge}</p>
                                </div>
                                <div class="appointment-actions">
                                    ${apt.status === 'scheduled' && apt.meeting_link ? `
                                        <button class="btn btn-success" 
                                                onclick="window.open('${apt.meeting_link}', '_blank')">
                                            🎥 Join Video Call
                                        </button>
                                    ` : ''}
                                    ${apt.status === 'scheduled' ? `
                                        <button class="btn btn-danger" 
                                                onclick="cancelAppointment(${apt.id})">
                                            Cancel
                                        </button>
                                    ` : ''}
                                </div>
                            </li>
                        `;
                    }).join('') +
                    '</ul>';
                
            } catch (error) {
                document.getElementById('appointments-list').innerHTML = 
                    '<p class="text-muted">Error loading appointments</p>';
                console.error('Error loading appointments:', error);
            }
        }
        
        // Cancel appointment
        async function cancelAppointment(appointmentId) {
            if (!confirm('Are you sure you want to cancel this appointment?')) {
                return;
            }
            
            try {
                await apiCall(`/appointments/${appointmentId}`, {
                    method: 'DELETE'
                });
                
                showAlert('Appointment cancelled successfully', 'success');
                loadAppointments();
                
            } catch (error) {
                showAlert('Failed to cancel appointment: ' + error.message, 'danger');
            }
        }
        
        // Make cancelAppointment available globally
        window.cancelAppointment = cancelAppointment;
        
        // Load appointments on page load
        loadAppointments();
    </script>
</body>
</html>
