<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CareConnect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1>🏥 CareConnect</h1>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="appointment.html">Appointments</a>
                <a href="period.html">Period Tracker</a>
                <a href="upload.html">Reports</a>
                <a href="chatbot.html">Chatbot</a>
                <div id="user-info"></div>
            </div>
        </div>
    </nav>
    
    <div class="container">
        <h2>Welcome to Your Dashboard</h2>
        
        <!-- User Info Card -->
        <div class="card">
            <h2>👤 Your Profile</h2>
            <div id="user-profile"></div>
        </div>
        
        <!-- Stats Grid -->
        <div class="dashboard-grid">
            <div class="stat-card">
                <h3>Upcoming Appointments</h3>
                <div class="stat-value" id="appointment-count">0</div>
            </div>
            
            <div class="stat-card">
                <h3>Medical Reports</h3>
                <div class="stat-value" id="report-count">0</div>
            </div>
            
            <div class="stat-card">
                <h3>Period Tracker</h3>
                <div class="stat-value" id="period-status">Not Set</div>
            </div>
        </div>
        
        <!-- Upcoming Appointments -->
        <div class="card">
            <h2>📅 Upcoming Appointments</h2>
            <div id="appointments-list"></div>
        </div>
        
        <!-- Period Reminder -->
        <div class="card" id="period-reminder-card" style="display: none;">
            <h2>🔔 Period Reminder</h2>
            <div id="period-reminder"></div>
        </div>
        
        <!-- Health Tips -->
        <div class="card">
            <h2>💡 Health Tips for You</h2>
            <div id="health-tips"></div>
        </div>
    </div>
    
    <script src="js/utils.js"></script>
    <script>
        // Require authentication
        requireAuth();
        initNavigation();
        
        // Get user data
        const user = getUser();
        
        // Display user profile
        document.getElementById('user-profile').innerHTML = `
            <p><strong>Name:</strong> ${user.name}</p>
            <p><strong>Email:</strong> ${user.email}</p>
            ${user.age ? `<p><strong>Age:</strong> ${user.age}</p>` : ''}
        `;
        
        // Load dashboard data
        async function loadDashboard() {
            try {
                // Load appointments
                const appointments = await apiCall('/appointments');
                const upcomingAppointments = appointments.filter(apt => apt.status === 'scheduled');
                document.getElementById('appointment-count').textContent = upcomingAppointments.length;
                
                // Display appointments
                const appointmentsList = document.getElementById('appointments-list');
                if (upcomingAppointments.length === 0) {
                    appointmentsList.innerHTML = '<p class="text-muted">No upcoming appointments</p>';
                } else {
                    appointmentsList.innerHTML = '<ul class="appointment-list">' +
                        upcomingAppointments.slice(0, 3).map(apt => `
                            <li class="appointment-item">
                                <div class="appointment-info">
                                    <h4>Dr. ${apt.doctor_name}</h4>
                                    <p>${formatDate(apt.date)} at ${formatTime(apt.time)}</p>
                                </div>
                                <div class="appointment-actions">
                                    ${apt.meeting_link ? `
                                        <button class="btn btn-success" onclick="window.open('${apt.meeting_link}', '_blank')">
                                            Join Video Call
                                        </button>
                                    ` : ''}
                                </div>
                            </li>
                        `).join('') +
                        '</ul>';
                    
                    if (upcomingAppointments.length > 3) {
                        appointmentsList.innerHTML += `<p class="text-center mt-2">
                            <a href="appointment.html">View all ${upcomingAppointments.length} appointments</a>
                        </p>`;
                    }
                }
                
                // Load reports count
                const reports = await apiCall('/reports');
                document.getElementById('report-count').textContent = reports.length;
                
                // Load period tracker data
                try {
                    const periodData = await apiCall('/period');
                    const daysUntil = periodData.days_until_next;
                    
                    if (daysUntil > 0) {
                        document.getElementById('period-status').textContent = `${daysUntil} days`;
                    } else if (daysUntil === 0) {
                        document.getElementById('period-status').textContent = 'Today';
                    } else {
                        document.getElementById('period-status').textContent = 'Late';
                    }
                    
                    // Show period reminder
                    const reminderCard = document.getElementById('period-reminder-card');
                    const reminderDiv = document.getElementById('period-reminder');
                    
                    if (periodData.is_late) {
                        reminderCard.style.display = 'block';
                        reminderDiv.innerHTML = `
                            <div class="alert alert-warning">
                                ⚠️ Your period is ${Math.abs(daysUntil)} days late. 
                                Expected date was ${formatDate(periodData.next_period_date)}.
                            </div>
                        `;
                    } else if (daysUntil <= 3 && daysUntil >= 0) {
                        reminderCard.style.display = 'block';
                        reminderDiv.innerHTML = `
                            <div class="alert alert-info">
                                🔔 Your next period is expected in ${daysUntil} day${daysUntil !== 1 ? 's' : ''} 
                                (${formatDate(periodData.next_period_date)}).
                            </div>
                        `;
                    }
                } catch (error) {
                    // Period tracker not set up
                    document.getElementById('period-status').textContent = 'Not Set';
                }
                
                // Load health tips
                const tipsData = { age: user.age || null };
                const healthTips = await apiCall('/health-tips', {
                    method: 'POST',
                    body: JSON.stringify(tipsData)
                });
                
                const tipsDiv = document.getElementById('health-tips');
                tipsDiv.innerHTML = '<ul class="tips-list">' +
                    healthTips.tips.slice(0, 5).map(tip => `<li>${tip}</li>`).join('') +
                    '</ul>';
                
            } catch (error) {
                console.error('Error loading dashboard:', error);
                showAlert('Error loading dashboard data', 'danger');
            }
        }
        
        // Load data on page load
        loadDashboard();
    </script>
</body>
</html>
